services:
  # Database Service
  mongo:
    image: mongo:7.0-jammy
    container_name: fx_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cross_border_fx
    volumes:
      - mongo_data:/data/db
    networks:
      - fx_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fx_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/cross_border_fx
      JWT_SECRET: ${JWT_SECRET:-fx_prod_super_secret_jwt_key_2026_xyz}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "http://localhost:3000,http://client:3000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - fx_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend Next.js Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: fx_client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      server:
        condition: service_healthy
    networks:
      - fx_network

volumes:
  mongo_data:
    driver: local

networks:
  fx_network:
    driver: bridge
